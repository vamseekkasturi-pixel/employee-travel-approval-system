{% extends "base.html" %}
{% block title %}New Request{% endblock %}
{% block content %}
<div class="card">
  <h1>New Travel Request</h1>
  <form method="post">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label for="destination">Destination</label>
    <input id="destination" name="destination" value="{{ form.get('destination', '') }}" required>

    <label for="purpose">Purpose of travel</label>
    <textarea id="purpose" name="purpose" required>{{ form.get('purpose', '') }}</textarea>

    <div class="row">
      <div>
        <label for="start_date">Start date</label>
        <input id="start_date" name="start_date" type="date" value="{{ form.get('start_date', '') }}" required>
      </div>
      <div>
        <label for="end_date">End date</label>
        <input id="end_date" name="end_date" type="date" value="{{ form.get('end_date', '') }}" required>
      </div>
    </div>

    <div class="row">
      <div>
        <label for="travel_mode">Travel mode</label>
        <select id="travel_mode" name="travel_mode" required>
          {% for m in modes %}
            <option value="{{ m }}" {{ 'selected' if form.get('travel_mode') == m }}>{{ m }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label for="estimated_cost">Estimated cost</label>
        <input id="estimated_cost" name="estimated_cost" type="number" min="0" step="0.01"
               value="{{ form.get('estimated_cost', '') }}" required>
      </div>
    </div>

    <div class="actions">
      <button class="btn" type="submit">Submit for approval</button>
      <a class="btn grey" href="{{ url_for('dashboard') }}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}

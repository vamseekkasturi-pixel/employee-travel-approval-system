{% extends "base.html" %}
{% block title %}Users{% endblock %}
{% block content %}
<div class="card">
  <h1>Users</h1>
  <table>
    <thead>
      <tr><th>Name</th><th>Email</th><th>Role</th><th>Department</th><th>Manager</th></tr>
    </thead>
    <tbody>
    {% for u in users %}
      <tr>
        <td>{{ u.name }}</td>
        <td>{{ u.email }}</td>
        <td>{{ u.role }}</td>
        <td>{{ u.department or '—' }}</td>
        <td>{{ u.manager_name or '—' }}</td>
      </tr>
    {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
